# AI/ML Pipeline Configuration

# Model Configuration
models:
  embeddings:
    primary:
      provider: "local"
      model_name: "all-MiniLM-L6-v2"
      dimension: 384
    fallback:
      provider: "openai"
      model_name: "text-embedding-3-small"
      dimension: 512
  
  sentiment:
    primary:
      provider: "local"
      model_name: "cardiffnlp/twitter-roberta-base-sentiment-latest"
    fallback:
      provider: "local"
      model_name: "vader"
  
  ad_copy:
    primary:
      provider: "anthropic"
      model_name: "claude-3-5-sonnet-20241022"
      max_tokens: 1024
      temperature: 0.7
    secondary:
      provider: "openai"
      model_name: "gpt-4o-2024-08-06"
      max_tokens: 1024
      temperature: 0.7
    tertiary:
      provider: "local"
      model_name: "meta-llama/Meta-Llama-3.1-70B-Instruct"
  
  persona_generation:
    provider: "anthropic"
    model_name: "claude-3-5-sonnet-20241022"
    max_tokens: 2048
    temperature: 0.5
  
  image_generation:
    primary:
      provider: "openai"
      model_name: "dall-e-3"
      size: "1024x1024"
      quality: "hd"
    fallback:
      provider: "local"
      model_name: "stabilityai/stable-diffusion-xl-base-1.0"

  clustering:
    algorithm: "hdbscan"
    min_cluster_size: 50
    min_samples: 10
    metric: "euclidean"
    dimensionality_reduction:
      algorithm: "umap"
      n_neighbors: 15
      n_components: 5
      metric: "cosine"

# Vector Database Configuration
vector_db:
  provider: "pinecone"  # or "qdrant", "weaviate", "chromadb"
  pinecone:
    environment: "us-east-1"
    index_name: "user-embeddings"
    dimension: 384
    metric: "cosine"
  qdrant:
    host: "localhost"
    port: 6333
    collection_name: "user_embeddings"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  rate_limiting:
    enabled: true
    requests_per_minute: 60
  cors:
    enabled: true
    origins: ["*"]
  authentication:
    enabled: true
    jwt_secret_key: "${JWT_SECRET_KEY}"
    access_token_expire_minutes: 30

# Cache Configuration
cache:
  redis:
    host: "localhost"
    port: 6379
    db: 0
    ttl:
      embeddings: 86400  # 24 hours
      personas: 604800   # 7 days
      ad_copy: 86400     # 24 hours
      api_responses: 3600  # 1 hour

# Feature Store Configuration
feature_store:
  provider: "feast"
  offline_store:
    type: "file"
    path: "/data/feature_store"
  online_store:
    type: "redis"
    connection_string: "localhost:6379"

# Data Pipeline Configuration
data_pipeline:
  batch_processing:
    schedule: "0 2 * * *"  # 2 AM daily
    batch_size: 1000
  
  streaming:
    enabled: false
    kafka:
      bootstrap_servers: ["localhost:9092"]
      topics:
        input: "social-media-posts"
        output: "processed-posts"
  
  preprocessing:
    min_text_length: 10
    max_text_length: 10000
    languages: ["en"]
    remove_duplicates: true
    deduplication_threshold: 0.9

# ML Training Configuration
training:
  clustering:
    schedule: "0 2 * * 0"  # Weekly on Sunday
    incremental: true
  
  persona_generation:
    schedule: "0 3 * * 0"  # Weekly on Sunday
    use_batch_api: true
  
  sentiment_model:
    schedule: "0 2 1 * *"  # Monthly
    epochs: 3
    learning_rate: 2.0e-5
    batch_size: 16

# A/B Testing Configuration
ab_testing:
  enabled: true
  default_experiment:
    name: "ad_copy_model_comparison"
    variants:
      control: 0.5
      treatment: 0.5
    metrics:
      - impression
      - click
      - conversion_value
  
  statistical_significance:
    confidence_level: 0.95
    min_sample_size: 1000

# Content Moderation Configuration
content_moderation:
  enabled: true
  services:
    - openai_moderation
    - perspective_api
    - custom_brand_safety
  
  perspective_api:
    attributes:
      - TOXICITY
      - SEVERE_TOXICITY
      - IDENTITY_ATTACK
      - INSULT
      - PROFANITY
      - THREAT
    threshold: 0.7
  
  brand_safety:
    blocked_keywords:
      - "guaranteed"
      - "risk-free"
      - "100% effective"
      - "miracle"
      - "cure-all"
    max_exclamation_marks: 2
    max_question_marks: 2

# Quality Scoring Configuration
quality_scoring:
  enabled: true
  thresholds:
    approved: 0.8
    approved_with_review: 0.6
    needs_improvement: 0.4
  
  weights:
    relevance: 0.3
    creativity: 0.2
    clarity: 0.2
    cta_effectiveness: 0.15
    brand_alignment: 0.15

# Cost Optimization Configuration
cost_optimization:
  enabled: true
  budget:
    monthly_limit: 10000  # USD
    alert_threshold: 0.8
  
  strategies:
    - caching
    - batch_processing
    - model_selection
    - fallback_to_local
  
  batch_api:
    enabled: true
    min_batch_size: 100
    max_wait_time: 3600  # 1 hour

# Monitoring Configuration
monitoring:
  prometheus:
    enabled: true
    port: 9090
  
  grafana:
    enabled: true
    port: 3000
  
  metrics:
    - api_latency
    - api_throughput
    - model_latency
    - cache_hit_rate
    - error_rate
    - cost_per_request
    - quality_scores
  
  alerts:
    - name: "high_error_rate"
      condition: "error_rate > 0.05"
      severity: "critical"
    - name: "high_latency"
      condition: "p95_latency > 2000"  # ms
      severity: "warning"
    - name: "budget_exceeded"
      condition: "daily_cost > budget_limit / 30"
      severity: "critical"

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  handlers:
    - console
    - file
  
  file:
    path: "/var/log/ml_pipeline"
    rotation: "1 day"
    retention: "30 days"
  
  structured_logging:
    enabled: true
    include_trace_id: true

# Social Media API Configuration
social_media:
  twitter:
    enabled: true
    rate_limit: 100  # requests per 15 min
  
  instagram:
    enabled: true
    rate_limit: 200  # requests per hour
  
  facebook:
    enabled: true
    rate_limit: 200  # requests per hour

# Infrastructure Configuration
infrastructure:
  auto_scaling:
    enabled: true
    min_replicas: 2
    max_replicas: 10
    target_cpu_utilization: 70
    target_memory_utilization: 80
  
  gpu:
    enabled: true
    type: "nvidia-tesla-a100"
    count: 2
  
  storage:
    type: "s3"
    bucket: "ml-pipeline-data"
    region: "us-east-1"

# Security Configuration
security:
  encryption:
    enabled: true
    algorithm: "AES-256"
  
  secrets_manager:
    provider: "vault"  # or "aws_secrets_manager"
    vault:
      url: "http://vault:8200"
  
  api_keys:
    rotation_days: 90
